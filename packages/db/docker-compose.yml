name: solar-sales

services:
  postgres:
    image: postgres
    container_name: solar-sales-postgres
    environment:
      POSTGRES_DB: solar-sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - solar-sales_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  solar-sales_postgres_data:
